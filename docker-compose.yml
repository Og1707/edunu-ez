version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: edununez_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DJANGO_DB_NAME:-edununez}
      POSTGRES_USER: ${DJANGO_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DJANGO_DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: edununez_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
