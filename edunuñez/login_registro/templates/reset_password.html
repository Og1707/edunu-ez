{%load static%}
<div class="container">
    <div class="reset-box">
        <div class="logo">
            <img src="{% static 'img/logo-icon.png' %}" alt="Logo">
        </div>
        <h2>Restablecer contraseña</h2>
        <p>Ingresa tu nueva contraseña a continuación.</p>
        <form method="POST">
            {% csrf_token %}
            <input type="password" name="new_password1" placeholder="Nueva contraseña" required>
            <input type="password" name="new_password2" placeholder="Confirmar contraseña" required>
            <button type="submit">Restablecer</button>
        </form>
        <div class="back-to-login">
            <a href="{% url 'login' %}">Volver al inicio de sesión</a>
        </div>
    </div>
</div>
